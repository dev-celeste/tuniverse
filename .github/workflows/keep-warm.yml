# Keeps the free Render API awake (it sleeps after 15 idle minutes), so a Spotify login
# never waits for a cold start. One free service running all month fits Render's 750 free hours.
# GitHub may run scheduled jobs a few minutes late, and pauses them after 60 days without commits.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://tuniverse-api.onrender.com/api/v1/health
